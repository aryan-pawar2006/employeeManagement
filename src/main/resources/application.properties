```properties
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=EmployeeManagement


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/ Employeemanagemnet
spring.datasource.username=root
spring.datasource.password=Aryan#123RN

# MySQL JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Automatically update database tables based on entity classes
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in the console
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# SERVER CONFIGURATION
# ==========================================

# Application runs on port 8080
server.port=8080
```